<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HoldUp Arena</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1d1a2b;color:#f4ecd8;font:16px/1.35 ui-monospace,Menlo,Consolas,monospace}
#app{max-width:720px;margin:0 auto;padding:8px 12px 24px}
canvas{display:block;width:100%;max-width:640px;margin:0 auto;image-rendering:pixelated;border:4px solid #0d0b16;background:#000}
h1{font-size:22px;margin:6px 0;letter-spacing:2px;color:#ffd166;text-shadow:3px 3px 0 #0d0b16}
.panel{background:#2c2742;border:4px solid #0d0b16;box-shadow:inset 0 0 0 2px #4a4370;padding:12px;margin-top:8px}
.btn{font:inherit;font-weight:700;color:#1d1a2b;background:#ffd166;border:0;border-bottom:4px solid #b8860b;padding:12px 16px;margin:4px 4px 4px 0;min-height:56px;cursor:pointer;text-transform:uppercase}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.safe{background:#7bd88f;border-bottom-color:#2d7a43}.btn.bad{background:#ff6b6b;border-bottom-color:#a32a2a}.btn.mid{background:#a9b4ff;border-bottom-color:#4c56a8}
.btn.small{min-height:56px;padding:6px 14px}.btn.ico{min-width:56px;border-radius:50%;padding:0;font-size:22px}.btn.off{opacity:.5}
.row{display:flex;flex-wrap:wrap;align-items:center}
.hide{display:none!important}
.tiny{font-size:13px;margin-top:6px}
.tag{display:inline-block;background:#ff6b6b;color:#1d1a2b;font-weight:700;padding:2px 6px;font-size:12px}
.tag.ok{background:#7bd88f}.tag.un{background:#a9b4ff}
.card{background:#f4ecd8;color:#1d1a2b;border:4px solid #0d0b16;padding:10px;margin:8px 0;display:flex;gap:12px;align-items:center}
.card img{width:45%;max-height:180px;object-fit:contain;background:#fff;border:2px solid #0d0b16}
.lbl b{display:block;font-size:22px}
.q{font-size:18px;font-weight:700;margin:6px 0}
.bub{background:#fff;color:#1d1a2b;border:3px solid #0d0b16;padding:8px;margin:8px 0;position:relative}
#score{display:flex;justify-content:space-between;font-weight:700;color:#ffd166}
video{width:100%;max-height:200px;background:#000;border:3px solid #0d0b16}
.big{font-size:40px;font-weight:700;color:#ffd166}
</style></head><body><div id="app">
<div id="score" class="hide"><span id="sp">YOU 0</span><span id="sr"></span><span id="sh">HOLDUP 0</span></div>
<canvas id="cv" width="320" height="176"></canvas>
<div id="ui"></div>
<div id="ov" class="hide" style="position:fixed;inset:0;background:rgba(13,11,22,.85);z-index:9;overflow:auto;padding:16px"><div class="panel" style="max-width:640px;margin:0 auto"><div id="ovb"></div><button class="btn" id="ovx" style="margin-top:10px">OK</button></div></div>
</div>
<script src="data.js"></script><script src="game.js"></script></body></html>
